name: site

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# A newer change supersedes an older build for the same branch or PR.
concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Refresh contribution data
        if: github.event_name == 'push'
        run: python .github/scripts/fetch-contributions.py
      - name: Build with link and asset validation
        run: python -m mkdocs build --strict
      - name: Save built site
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: site/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Publish validated master
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: site/
      - name: Publish to GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site/
          force_orphan: false
          commit_message: 'deploy: ${{ github.sha }}'
