site_name: Jiucheng's CTF Note
site_description: 久诚的 CTF 学习笔记
site_url: https://jiuchengovo.github.io/
repo_url: https://github.com/Jiuchengovo/Jiuchengovo.github.io

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换浅色模式

# 自定义主题：设计令牌 → 正文观感 → 首页组件
extra_css:
  - theme/css/variables.css
  - theme/css/main.css
  - theme/css/components.css

extra_javascript:
  - javascripts/theme.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - attr_list
  - codehilite
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

nav:
  - 首页: index.md
  - Lab 0: Crypto Lab 0.md
  - "Lab 1":
      - "Crypto": Crypto Lab 1.md
      - "Web": "Lab 1：Web.md"
      - "Web基础知识": Web_Lab1.md
      - "Pwn": Pwn.md
      - "Misc": "Lab 1 Misc.md"
      - "Reverse": "rev lab 1.md"
  - "Lab 2":
      - "Crypto": Crypto Lab 2.md
      - "Misc": Misc Lab 2.md
  - "Lab 3":
      - "Crypto": Crypto Lab 3.md
      - "Misc": Misc Lab 3.md

plugins:
  - search
